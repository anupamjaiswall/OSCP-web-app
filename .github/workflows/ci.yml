name: V33 build and validation
on:
  push:
    branches: [ main, v33-integration ]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build, test, audit, validate
        run: npm run check
      - name: Ensure generated exam artifact is committed
        run: git diff --exit-code -- index.html