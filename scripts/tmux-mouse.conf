# OSCP tmux mouse selection / copy / paste — companion to scripts/clipboard.sh
# Requires a modern tmux, and ~/bin/clipboard.sh installed on Kali.
# These bindings can be sourced with: tmux source-file ~/bin/tmux-mouse.conf
# For persistence, keep the same block in ~/.tmux.conf or source this file there.
#
# Left drag over regular shell output: copy to tmux buffer AND attempt desktop clipboard.
# Middle click over shell output: paste the latest tmux buffer.
# Shift+drag: use terminal-native selection (terminal-dependent).
# Ctrl+Shift+V: paste desktop clipboard (terminal-dependent).

set -g mouse on
setw -g mode-keys vi
set -s set-clipboard off

# Mouse selection ends in the copy-mode-vi table; keep copy-mode too for compatibility.
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel '"$HOME/bin/clipboard.sh" copy'
bind -T copy-mode MouseDragEnd1Pane send -X copy-pipe-and-cancel '"$HOME/bin/clipboard.sh" copy'

# Select the clicked pane; middle click pastes tmux buffer.
# Forward events to interactive applications (Vim, htop) when they capture the mouse.
bind -n MouseDown2Pane select-pane -t= \; if-shell -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' 'send-keys -M' 'paste-buffer -p -t='
