name: Apply V20 Windows AD toolbox
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v20-toolbox.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Force newest preserved checklist as V20 base
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/v20-toolbox-patch.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace("v19_quick_p = ROOT / 'OSCP-V19-EXPERT-QUICKCARD.md'", "v19_check_p = ROOT / 'OSCP-V19-Checklist-2026-Exam-Optimized.md'\nv19_quick_p = ROOT / 'OSCP-V19-EXPERT-QUICKCARD.md'", 1)
          s = s.replace("current = current_p.read_text(encoding='utf-8')\nv19_quick =", "current = current_p.read_text(encoding='utf-8')\nv19_check = v19_check_p.read_text(encoding='utf-8')\nv19_quick =", 1)
          s = s.replace("if MARKER in index or MARKER in current:", "if MARKER in index or MARKER in v19_check:", 1)
          s = s.replace("if anchor not in current:", "if anchor not in v19_check:", 1)
          s = s.replace("current_v20 = current", "current_v20 = v19_check", 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Apply V20 patch and smoke tests
        run: python3 .github/v20-toolbox-patch.py
      - name: Commit V20 release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html OSCP-Checklist-2026-Exam-Optimized.md OSCP-V20-Checklist-2026-Exam-Optimized.md OSCP-V20-EXPERT-QUICKCARD.md OSCP-V20-README.md
          git rm .github/v20-toolbox-patch.py .github/workflows/apply-v20-toolbox.yml
          git commit -m 'V20: add complete Windows AD fallback toolbox'
          git push
