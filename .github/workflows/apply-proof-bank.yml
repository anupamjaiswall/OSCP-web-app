name: Apply proof bank
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-proof-bank.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch exam UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'id="examBankBtn"' in s:
              raise SystemExit('proof bank already installed')
          dec=lambda x: base64.b64decode(x).decode('utf-8')
          button=dec('ICA8YnV0dG9uIGNsYXNzPSJidG4gZ29vZCIgaWQ9ImV4YW1CYW5rQnRuIiB0eXBlPSJidXR0b24iIHRpdGxlPSJTY29yZS1zYWZlIHByb29mIGJhbmtpbmcgKEFsdCtCKSIgYXJpYS1oYXNwb3B1cD0iZGlhbG9nIj7inJMgQkFOSzwvYnV0dG9uPgo=')
          css=dec('')
          modal=dec('')
          js=dec('')
          anchor='  <button class="btn" id="themeBtn" title="Toggle reference theme">◐</button>'
          if anchor not in s: raise SystemExit('top-bar anchor missing')
          s=s.replace(anchor,button+anchor,1)
          if '</head>' not in s or '</body>' not in s: raise SystemExit('document anchors missing')
          s=s.replace('</head>',css+'\n</head>',1)
          s=s.replace('</body>',modal+'\n'+js+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          for x in ['id="examBankBtn"','id="examBankModal"','window.OSCP_PROOF_BANK','[EVIDENCE:PACKET]','Exam Control Panel']:
              assert x in s, x
          assert s.count('id="examBankBtn"') == 1
          assert s.count('id="examBankModal"') == 1
          print('proof-bank smoke test passed')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Add score-safe proof banking gate'
          git push
