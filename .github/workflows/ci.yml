name: V34.53 build and validation
on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Build, test, audit, validate
        run: npm run check
      - name: Headless browser render gate
        timeout-minutes: 2
        run: npm run browser-smoke
      - name: Reference find browser gate
        timeout-minutes: 2
        run: npm run reference-find-smoke
      - name: Passer-loop browser gate
        timeout-minutes: 2
        run: npm run passer-loop-smoke
      - name: Tooling browser gate
        timeout-minutes: 2
        run: npm run tooling-smoke
      - name: Reliability safety browser gate
        timeout-minutes: 2
        run: npm run reliability-smoke
      - name: Import safety browser gate
        timeout-minutes: 2
        run: npm run import-safety-smoke
      - name: Session lifecycle dry-run
        timeout-minutes: 2
        run: npm run session-lifecycle-smoke
      - name: Verify generated artifacts are committed on pull requests
        if: github.event_name == 'pull_request'
        run: git diff --exit-code -- index.html README.md

  sync-generated:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: One-time V34.54 legacy-core extraction
        run: node scripts/v34-54-core-extraction.mjs
      - name: Validate extracted V34.54 source
        timeout-minutes: 4
        run: |
          npm run check
          npm run browser-smoke
          npm run reference-find-smoke
          npm run passer-loop-smoke
          npm run tooling-smoke
          npm run reliability-smoke
          npm run import-safety-smoke
          npm run session-lifecycle-smoke
      - name: Rebuild generated artifacts
        run: npm run build
      - name: Commit V34.54 extraction and generated artifacts
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "V34.54: extract storage helpers from legacy core"
            git push
          fi
      - name: Verify extraction workspace is clean
        run: test -z "$(git status --porcelain)"
