name: V34.51 build and validation
on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Finalize V34.51 source-coupled test migration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/run-tests.mjs')
          s=p.read_text()
          old='const b=src.indexOf("$(\'#importSession\').onchange",a);'
          new="const b=src.indexOf('let externalBackupMeta=',a);"
          if old in s:
              p.write_text(s.replace(old,new))
          PY
      - name: Build, test, audit, validate
        run: npm run check
      - name: Headless browser render gate
        timeout-minutes: 2
        run: npm run browser-smoke
      - name: Reference find browser gate
        timeout-minutes: 2
        run: npm run reference-find-smoke
      - name: Passer-loop browser gate
        timeout-minutes: 2
        run: npm run passer-loop-smoke
      - name: Tooling browser gate
        timeout-minutes: 2
        run: npm run tooling-smoke
      - name: Reliability safety browser gate
        timeout-minutes: 2
        run: npm run reliability-smoke
      - name: Import safety browser gate
        timeout-minutes: 2
        run: npm run import-safety-smoke
      - name: Session lifecycle dry-run
        timeout-minutes: 2
        run: npm run session-lifecycle-smoke
      - name: Verify generated artifacts are committed on pull requests
        if: github.event_name == 'pull_request'
        run: git diff --exit-code -- index.html README.md tests/run-tests.mjs

  sync-generated:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Finalize V34.51 source-coupled test migration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/run-tests.mjs')
          s=p.read_text()
          old='const b=src.indexOf("$(\'#importSession\').onchange",a);'
          new="const b=src.indexOf('let externalBackupMeta=',a);"
          if old in s:
              p.write_text(s.replace(old,new))
          PY
      - name: Rebuild generated artifacts
        run: npm run build
      - name: Sync final test migration and generated artifacts on main
        run: |
          if ! git diff --quiet -- tests/run-tests.mjs index.html README.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tests/run-tests.mjs index.html README.md
            git commit -m "test: finish V34.51 import ownership migration"
            git push
          fi
      - name: Verify generated artifacts are clean after main sync
        run: git diff --exit-code -- tests/run-tests.mjs index.html README.md
