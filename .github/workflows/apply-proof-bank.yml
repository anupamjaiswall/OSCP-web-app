name: Apply proof bank
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-proof-bank.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply and smoke-test proof bank
        run: python3 .github/proof-bank-patch.py
      - name: Commit app change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Add score-safe proof banking gate'
          git push
