name: Apply pre-exam auto-update warning
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-preexam-warning.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply and smoke-test warning
        run: python3 .github/preexam-warning-patch.py
      - name: Commit app change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Add pre-exam auto-update shutdown warning'
          git push
