name: V34.6 build and validation
on:
  push:
    branches: [ main ]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build, test, audit, validate
        run: npm run check
      - name: Headless browser boot and interaction gate
        timeout-minutes: 1
        run: node scripts/browser-smoke.mjs
      - name: Ensure generated exam artifact is committed
        run: git diff --exit-code -- index.html