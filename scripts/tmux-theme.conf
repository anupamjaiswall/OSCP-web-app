# OSCP Night Ops — high-contrast amber + tactical teal, no special font required.
set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-style 'bg=colour234,fg=colour252'
set -g status-left-length 55
set -g status-right-length 90

set -g status-left '#[bg=colour172,fg=colour234,bold] OSCP #[bg=colour236,fg=colour252,bold] #{session_name} #[default] '
set -g window-status-separator ' '
set -g window-status-format '#[bg=colour236,fg=colour245] #I:#W#{?window_flags,#{window_flags},} #[default]'
set -g window-status-current-format '#[bg=colour37,fg=colour232,bold] #I:#W#{?window_flags,#{window_flags},} #[default]'
set -g window-status-activity-style 'fg=colour214,bg=colour236,bold'
set -g window-status-bell-style 'fg=colour196,bg=colour236,bold'
set -g status-right '#{?client_prefix,#[bg=colour214,fg=colour232,bold] PREFIX #[default] ,}#[fg=colour109]#{host_short} #[fg=colour245]| #[fg=colour180]%a %d %b #[fg=colour250,bold]%H:%M '

set -g pane-border-style 'fg=colour239'
set -g pane-active-border-style 'fg=colour37'
set -g pane-border-status top
set -g pane-border-format '#[fg=colour109] #{pane_index} #[fg=colour243]#{pane_current_command} '
set -g message-style 'bg=colour24,fg=colour255,bold'
set -g message-command-style 'bg=colour236,fg=colour229'
set -g mode-style 'bg=colour172,fg=colour232,bold'
set -g clock-mode-colour colour172
set -g display-panes-colour colour172
set -g display-panes-active-colour colour37
set -g display-time 2500
