# OSCP clipboard: BOTH local graphical clipboard and compatible client/SSH OSC52.
# Copy-mode always saves tmux's own buffer even if external clipboard is absent.
# tmux's OSC52 path also reaches a host OS over SSH if the terminal supports it.
# Kali local copy-pipe uses ~/bin/clipboard.sh (Wayland, X11 or Termux).
set-option -g mouse on
set-window-option -g mode-keys vi
set-option -s set-clipboard on
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel '"$HOME/bin/clipboard.sh" copy'
bind-key -T copy-mode-vi Y send-keys -X copy-pipe-and-cancel '"$HOME/bin/clipboard.sh" copy'
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel '"$HOME/bin/clipboard.sh" copy'
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel '"$HOME/bin/clipboard.sh" copy'
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel '"$HOME/bin/clipboard.sh" copy'
# Middle click pastes the tmux buffer; preserve mouse-aware applications.
bind-key -n MouseDown2Pane select-pane -t= \; if-shell -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' 'send-keys -M' 'paste-buffer -p -t='
