# One OSCP clipboard mechanism — no tmux-yank binding collisions.
# y/Y/left-drag copy BOTH to tmux buffer and to Kali desktop clipboard.
# Ctrl+A then ] pastes tmux buffer. GUI Ctrl+V pastes desktop clipboard.
set-option -g mouse on
set-window-option -g mode-keys vi
set-option -s set-clipboard external
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel '"$HOME/bin/clipboard.sh" copy'
bind-key -T copy-mode-vi Y send-keys -X copy-pipe-and-cancel '"$HOME/bin/clipboard.sh" copy'
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel '"$HOME/bin/clipboard.sh" copy'
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel '"$HOME/bin/clipboard.sh" copy'
# Middle-click tmux paste except in applications (e.g. Vim) requesting mouse.
bind-key -n MouseDown2Pane select-pane -t= \; if-shell -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' 'send-keys -M' 'paste-buffer -p -t='
