# OSCP tmux — exam-safe, one consistent configuration.
# Installed as ~/.tmux.conf. Previous file backed up by install.sh.
unbind-key C-b
set-option -g prefix C-a
bind-key -T prefix C-a send-prefix
set-option -g mouse on
set-option -g history-limit 100000
set-option -g focus-events on
set-option -g allow-rename off
set-window-option -g automatic-rename off
set-window-option -g remain-on-exit on
set-window-option -g mode-keys vi
set-option -g renumber-windows on
# OSC52 reaches the terminal/host across SSH when that terminal supports it.
# Local clipboard copies are additionally piped to ~/bin/clipboard.sh.
set-option -s set-clipboard on
# On reattach, import fresh GUI variables instead of keeping the old login's.
set-option -g update-environment 'DISPLAY SSH_ASKPASS SSH_AUTH_SOCK SSH_AGENT_PID SSH_CONNECTION WINDOWID XAUTHORITY WAYLAND_DISPLAY XDG_SESSION_TYPE XDG_RUNTIME_DIR DBUS_SESSION_BUS_ADDRESS'

# Ctrl+A then | = side-by-side; Ctrl+A then - = top/bottom.
bind-key -T prefix | split-window -h -c '#{pane_current_path}'
bind-key -T prefix - split-window -v -c '#{pane_current_path}'
bind-key -T prefix h select-pane -L
bind-key -T prefix j select-pane -D
bind-key -T prefix k select-pane -U
bind-key -T prefix l select-pane -R
bind-key -T prefix H resize-pane -L 5
bind-key -T prefix J resize-pane -D 5
bind-key -T prefix K resize-pane -U 5
bind-key -T prefix L resize-pane -R 5
bind-key -T prefix X kill-pane
bind-key -T prefix r source-file ~/.tmux.conf \; display-message 'OSCP tmux reloaded'
bind-key -T prefix [ copy-mode
bind-key -T prefix ] paste-buffer
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T prefix S run-shell 'mkdir -p "$HOME/oscp/logs"; chmod 700 "$HOME/oscp/logs"; tmux capture-pane -p -S - > "$HOME/oscp/logs/pane-$(date +%F_%H%M%S).txt"' \; display-message 'Scrollback saved locally'

# Timestamped per-pane recording (pipe-pane -o avoids duplicate pipes).
set-hook -g after-new-session 'run-shell -b "$HOME/bin/tmux-start-log.sh #{pane_id}"'
set-hook -g after-new-window 'run-shell -b "$HOME/bin/tmux-start-log.sh #{pane_id}"'
set-hook -g after-split-window 'run-shell -b "$HOME/bin/tmux-start-log.sh #{pane_id}"'

# Optional session recovery plugin; clipboard is handled directly, never by yank.
set-option -g @plugin 'tmux-plugins/tpm'
set-option -g @plugin 'tmux-plugins/tmux-resurrect'
if-shell 'test -f "$HOME/.tmux/plugins/tpm/tpm"' 'run-shell "$HOME/.tmux/plugins/tpm/tpm"'

# LAST: keep custom clipboard bindings and styles even when plugins load.
source-file ~/bin/tmux-mouse.conf
source-file ~/.tmux-theme.conf
