name: V34.18 build and validation
on:
  push:
    branches: [ main ]
  pull_request:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build, test, audit, validate
        run: npm run check
      - name: Headless browser render gate
        timeout-minutes: 2
        run: node scripts/browser-smoke.mjs
      - name: Sync generated exam artifact on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if ! git diff --quiet -- index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "build: sync generated exam artifact"
            git push
          fi
      - name: Ensure generated exam artifact is committed
        run: git diff --exit-code -- index.html