name: V34.47 build and validation
on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Build, test, audit, validate
        run: npm run check
      - name: Headless browser render gate
        timeout-minutes: 2
        run: node scripts/browser-smoke.mjs
      - name: Reference find browser gate
        timeout-minutes: 2
        run: node scripts/reference-find-smoke.mjs
      - name: Passer-loop browser gate
        timeout-minutes: 2
        run: node scripts/passer-loop-smoke.mjs
      - name: Tooling browser gate
        timeout-minutes: 2
        run: node scripts/tooling-smoke.mjs
      - name: Verify generated artifacts are committed on pull requests
        if: github.event_name == 'pull_request'
        run: git diff --exit-code -- index.html README.md

  sync-generated:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Rebuild generated artifacts
        run: npm run build
      - name: Sync generated artifacts on main
        run: |
          if ! git diff --quiet -- index.html README.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html README.md
            git commit -m "build: sync generated exam artifacts"
            git push
          fi
      - name: Verify generated artifacts are clean after main sync
        run: git diff --exit-code -- index.html README.md
