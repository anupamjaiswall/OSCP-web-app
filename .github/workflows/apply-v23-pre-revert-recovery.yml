name: Apply V23 pre-revert recovery shortcut
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v23-pre-revert-recovery.yml'
      - '.github/v23-pre-revert-recovery.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply focused V23 patch and verify
        run: python3 .github/v23-pre-revert-recovery.py
      - name: Commit V23 release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html OSCP-V23-README.md
          git rm -f .github/v23-pre-revert-recovery.py .github/workflows/apply-v23-pre-revert-recovery.yml
          git commit -m 'V23: add pre-revert recovery shortcut'
          git push
