# OSCP tmux split orientation — visual dividers, not tmux -h/-v names.
# Source this LAST if other configs/plugins override split bindings:
#   tmux source-file ~/bin/tmux-splits.conf
#
# Ctrl+A then | : vertical dividing LINE (panes LEFT | RIGHT).
# Ctrl+A then - : horizontal dividing LINE (panes TOP / BOTTOM).
# tmux -h places panes horizontally (side by side), while -v stacks them.
# Do not swap these flags when describing the divider orientation.

unbind-key -T prefix |
unbind-key -T prefix -
bind-key -T prefix | split-window -h -c '#{pane_current_path}'
bind-key -T prefix - split-window -v -c '#{pane_current_path}'
