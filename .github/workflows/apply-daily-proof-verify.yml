name: Apply proof submission verification guard
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-daily-proof-verify.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply focused proof verification patch
        run: python3 .github/daily-proof-verify-patch.py
      - name: Verify HTML structure
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          checks={
            'single reports view': s.count('<section id="reportsView" class="view">') == 1,
            'bank guard': s.count('proofSubmissionVerifyGuard') == 1,
            'report guard': s.count('proofSubmissionVerifyCard') == 1,
            'official warning': 'control panel does not validate whether the submitted proof is correct' in s.lower(),
            'no secret persistence field': 'proofSubmissionValue' not in s,
          }
          bad=[k for k,v in checks.items() if not v]
          if bad: raise SystemExit('failed: '+', '.join(bad))
          print('smoke tests passed:', ', '.join(checks))
          PY
      - name: Commit focused improvement
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm -f .github/daily-proof-verify-patch.py .github/workflows/apply-daily-proof-verify.yml
          git commit -m 'fix: require proof submission sanity check'
          git push
